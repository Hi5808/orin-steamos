name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # gitleaks scans the whole history
      - name: Install shellcheck and gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          curl -fsSLo /tmp/gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gl.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/gl.tgz -C /usr/local/bin gitleaks
      - name: shellcheck, unit tests, secrets scan
        run: scripts/ci-check.sh
