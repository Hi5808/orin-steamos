# SteamOS-style boot: no greeter, autologin straight into Steam Game Mode.
# steamos-session-select writes zz-steamos-autologin.conf (sorts later, wins)
# to switch between Game Mode and the desktop. A one-time desktop override is marked
# "# steamos-orin: oneshot" and removed at boot by steamos-orin-session-reset.service.
# Nothing switches to the desktop persistently except an explicit user choice.
[General]
DisplayServer=x11
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot

[Autologin]
User=steamos
Session=steam-gamemode.desktop
Relogin=true

[Users]
MinimumUid=1000
