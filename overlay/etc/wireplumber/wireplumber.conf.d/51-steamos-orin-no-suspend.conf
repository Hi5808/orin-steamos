# orin-steamos: never suspend ALSA output sinks (WirePlumber >= 0.5 syntax; 0.4.x ignores
# this directory and uses main.lua.d/51-steamos-orin-no-suspend.lua instead).
# Suspending an idle HDMI sink makes an audible thump whenever it resumes.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
