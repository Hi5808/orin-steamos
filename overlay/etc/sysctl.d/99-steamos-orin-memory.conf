# steamos-orin memory tuning for zram-backed swap on an 8 GB Orin Nano.
# zram is cheap to swap to (no disk I/O), so favor swapping anonymous pages over dropping page cache.
vm.swappiness = 180
# zram has no seek cost: read single pages, not clusters
vm.page-cluster = 0
# Start kswapd reclaim earlier (1.25% of RAM) so allocations stall less often
vm.watermark_scale_factor = 125
vm.watermark_boost_factor = 0
# 64 MiB reserve (~0.85% of 7.4 GiB usable) for atomic and driver allocations (judgment call, not an NVIDIA value)
vm.min_free_kbytes = 65536
