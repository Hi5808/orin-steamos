# Named zz- so it sorts after /usr/lib/systemd/system/bluetooth.service.d/nv-bluetooth-service.conf
# steamos-orin: L4T's nv-bluetooth-service.conf runs bluetoothd with -d (debug logging,
# hundreds of journal lines per scan) and without the audio plugins. Run it without -d and
# with the A2DP/AVRCP plugins so Bluetooth headsets work through PipeWire (as on SteamOS).
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --noplugin=sap
