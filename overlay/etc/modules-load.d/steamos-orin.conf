# Controller/input modules built out-of-tree by scripts/chroot-build-modules.sh
# (NVIDIA's 6.8.12-tegra kernel does not enable these). uinput backs Steam Input's
# virtual controllers; the hid-* drivers give full function (gyro/rumble/touchpad)
# for DualSense/DualShock, Switch Pro and the Steam Controller.
uinput
hid-steam
hid-playstation
hid-nintendo
hid-sony
